# kith OS for a node with a Ryzen 7040, 8040 or 8000G's GPU (Radeon 780M, 760M, 740M):
#   KITH_OS_VERSION=1.0.1+gpu-amd sh os/build.sh --spec os/examples/gpu-amd.yaml
# A feature brings its driver's firmware: list more under `firmware:` only for what
# no feature knows (paths or globs in linux-firmware).
features: [gpu-amd-phoenix]
firmware: []
