# kith OS for a node that hands a PCI card (a GPU, a USB controller) to a virtual machine:
#   KITH_OS_VERSION=1.0.1+vfio sh os/build.sh --spec os/examples/vfio.yaml
# The IOMMU is in every kith OS kernel; this adds vfio-pci. Bind the card with
# vfio-pci.ids=VENDOR:DEVICE on the kernel's command line.
features: [vfio]
firmware: []
