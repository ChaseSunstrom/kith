[package]
name = "kith-api"
description = "kith resource types, JSON Schemas and the resource store"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# A binary reads the kinds' schemas out of v1.schema.json (build.rs); this links what makes them.
generate = ["dep:schemars"]
# The signers' book a replicated store keeps (format 3, `Store::nonce`): kith-store turns it on.
# kith's own file store never signs, and links none of it (8 KB of kith-remote, T-0779).
signing = []

[dependencies]
kith-yaml.workspace = true
serde.workspace = true
serde_json.workspace = true
# What writes v1.schema.json from the kinds: for the tests that keep that file as the code is.
schemars = { workspace = true, optional = true }
similar.workspace = true

[dev-dependencies]
# (Its own tests are the one build with the generator in it.)
kith-api = { path = ".", features = ["generate"] }

[lints]
workspace = true
