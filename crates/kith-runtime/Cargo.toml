[package]
name = "kith-runtime"
description = "kith's workload runtime: OCI images and containers, no containerd and no shim"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# v2 only: no cgroup v1, no systemd/dbus driver, and no libseccomp (a C library) yet.
libcontainer = { version = "0.7", default-features = false, features = ["v2"] }
# Already in the tree through libcontainer: exec units get their cgroup from it directly.
libcgroups = { version = "0.7", default-features = false, features = ["v2"] }
oci-spec = "0.10"
# bpf(2) for a cgroup's device filter: the workspace's unsafe code is in this one crate.
kith-dm-sys = { path = "../kith-dm-sys" }
# TLS through rustls with ring: smaller than the default aws-lc and no cmake.
oci-client = { version = "0.18", default-features = false, features = ["rustls-tls-no-provider"] }
# The metadata GETs oci-client buffers whole (manifests, configs, referrers), read with a cap and
# the same timeouts as the blobs. Only rustls: no json or stream, which nothing here uses.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["fs", "rt"] }
tar = { version = "0.4", default-features = false }
flate2 = "1"
serde_json.workspace = true
nix = { version = "0.29", features = ["process", "user", "signal", "sched", "fs", "mount"] }
# Already in the tree through libcontainer.
caps = "0.5"
# Image signatures. (Both in the tree already: rustls verifies with ring.)
ring = "0.17"
base64 = "0.22"
# A keyless signature's certificate, checked to its authority at the log's time (in the
# tree through rustls).
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
# Whether a file has extended attributes (one that has is never shared). In the tree already
# through libcontainer's pathrs.
rustix = { version = "1", default-features = false, features = ["fs", "std"] }
# The seccomp filter, written out in Rust: no C libseccomp (kithd is one static binary).
seccompiler = "0.5"

[dev-dependencies]
# An authority and its certificates, made in the tests (in the tree through kithd).
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
