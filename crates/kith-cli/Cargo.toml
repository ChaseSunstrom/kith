[package]
name = "kith-cli"
description = "The `kith` command"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kith"
path = "src/main.rs"

[dependencies]
kith-yaml.workspace = true
kith-api.workspace = true
kith-packages = { path = "../kith-packages", default-features = false }
kith-lang = { path = "../kith-lang" }
kith-kube = { path = "../kith-kube" }
# Makes its own tables of functions read-only at start (the workspace's one crate with unsafe).
kith-dm-sys = { path = "../kith-dm-sys" }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
# A passphrase is typed unseen (`kith node passphrase`).
# (`signal`: `machine shell` follows the window and puts the terminal back on a hangup.)
nix = { version = "0.29", features = ["term", "signal"] }
# The admin's key, from the passphrase: PBKDF2 and Ed25519 (`signing.rs`, kithd's `access_sign.rs`).
ring = "0.17"
# The TLS client behind `--server` (cargo feature `remote`, off by default: the default kith links no TLS).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }

# The Docker Engine API front, `kith docker serve` (crates/kith-docker, T-1205): in the kith-remote build, not the default kith.
kith-docker = { path = "../kith-docker", optional = true }

[features]
remote = ["dep:rustls"]
docker = ["dep:kith-docker"]

[dev-dependencies]
# The remote tests' own cluster CA and node certificates, as kithd's pki.rs makes them.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[lints]
workspace = true
