[package]
name = "kithd"
description = "The kith node daemon: API server, store and workload controller in one process"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The same as kith-runtime pulls images with.
oci-client = { version = "0.18", default-features = false, features = ["rustls-tls-no-provider"] }
semver = "1"
kith-yaml.workspace = true
kith-packages = { path = "../kith-packages" }
kith-api.workspace = true
kith-store = { path = "../kith-store" }
kith-dns = { path = "../kith-dns" }
kith-sched = { path = "../kith-sched" }
kith-mesh = { path = "../kith-mesh" }
kith-dm-sys = { path = "../kith-dm-sys" }
kith-runtime = { path = "../kith-runtime" }
# (In the tree through kith-runtime.) What the first process of a machine does: init.rs.
nix = { version = "0.29", features = ["mount", "reboot", "hostname", "fs", "net", "signal", "poll"] }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt", "net", "signal", "sync", "time", "macros", "io-util", "process"] }
# Cluster identity (Phase 2): rustls, tokio-rustls, webpki, reqwest and ring are already
# linked through kith-runtime's registry client; rcgen writes the certificates.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
ring = "0.17"
# `kith run` takes the connection over after the 101 (axum's own dependencies, already built).
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# (In the tree already.) ACME speaks base64url.
base64 = "0.22"
# Controllers and admission hooks (PLAN 4.10): an interpreter, about 0.9 MB. (wasmtime, which
# the plan names, is several MB and compiles to machine code; these modules are small.)
# portable-dispatch: a loop, not tail calls the compiler has to turn into jumps: without that
# guarantee (a debug build) the other way overflows the stack of whoever runs a module.
wasmi = { version = "2", default-features = false, features = ["std", "validate", "portable-dispatch"] }
# A body read and sent a piece at a time (blobs.rs; a test's request too); in the tree already.
futures-util = "0.3"
# A backup is a tar (in the tree through kith-runtime, which unpacks image layers with it).
tar = { version = "0.4", default-features = false }
# The blob store's names. `pure`: no C or assembly to build for musl.
blake3 = { version = "1", default-features = false, features = ["pure", "std"] }
sha2 = "0.11"

[dev-dependencies]
serde_json.workspace = true
# (The ACME tests' authority reads the CSR it is sent: rcgen's parser, already in the tree.)
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
# Test modules are written as text.
wat = "1"

[lints]
workspace = true
