[package]
name = "kithd"
description = "The kith node daemon: API server, store and workload controller in one process"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kith-api.workspace = true
kith-store = { path = "../kith-store" }
kith-dns = { path = "../kith-dns" }
kith-sched = { path = "../kith-sched" }
kith-mesh = { path = "../kith-mesh" }
kith-runtime = { path = "../kith-runtime" }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt", "net", "signal", "sync", "time", "macros", "io-util"] }
# Cluster identity (Phase 2): rustls, tokio-rustls, webpki, reqwest and ring are already
# linked through kith-runtime's registry client; rcgen writes the certificates.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
ring = "0.17"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
