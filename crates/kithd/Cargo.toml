[package]
name = "kithd"
description = "The kith node daemon: API server, store and workload controller in one process"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Test only, and in no release or default build (ci/musl.sh builds it only when KITHD_FEATURES
# says so, into a folder of its own): `POST /v1/forge` lets a leader append an entry it was not
# asked for, so the access VM test can show every other node refuses it (forge.rs).
forge = []
# Test only, in no release (ci/musl.sh builds it into a folder of its own, os/build.sh lets only
# that folder take it): a kithd started with `fido2-test` among the kernel's words makes security
# keys on /dev/uhid and runs the client against them, for the fido2 VM test (fido2_test.rs).
fido2-test = []
# Test only, in no release (ci/musl.sh builds it into a folder of its own, os/build.sh lets only
# that folder take it): the word `kith.disk-add=SERIAL` on the command line makes the disk of that
# serial a data disk at the start, until the add verb does (data_disk/boot.rs), for the disk VM test.
disk-test = []

[dependencies]
# The same as kith-runtime pulls images with.
oci-client = { version = "0.18", default-features = false, features = ["rustls-tls-no-provider"] }
semver = "1"
kith-yaml.workspace = true
kith-packages = { path = "../kith-packages" }
kith-kube = { path = "../kith-kube" }
kith-api.workspace = true
kith-store = { path = "../kith-store" }
kith-dns = { path = "../kith-dns" }
kith-sched = { path = "../kith-sched" }
kith-mesh = { path = "../kith-mesh" }
kith-dm-sys = { path = "../kith-dm-sys" }
kith-runtime = { path = "../kith-runtime" }
# (In the tree through kith-runtime.) What the first process of a machine does: init.rs.
nix = { version = "0.29", features = ["mount", "reboot", "hostname", "fs", "dir", "net", "signal", "poll", "term", "time", "resource", "kmod", "socket", "zerocopy"] }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt", "net", "signal", "sync", "time", "macros", "io-util", "process"] }
# Cluster identity (Phase 2): rustls, tokio-rustls, webpki, reqwest and ring are already
# linked through kith-runtime's registry client; rcgen writes the certificates.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
ring = "0.17"
# `kubectl port-forward` deflates its SPDY header blocks (spdy.rs): inflate only, already in the tree.
miniz_oxide = { version = "0.9", default-features = false }
# The passphrase of an encrypted state (crypt.rs): ring has no memory-hard KDF.
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
# `kith run` takes the connection over after the 101, and the ingress reads the requests of
# a host with paths or headers (axum's own dependencies, already built).
hyper = { version = "1", default-features = false, features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
# (In the tree already.) ACME speaks base64url.
base64 = "0.22"
# Controllers and admission hooks (PLAN 4.10): an interpreter, about 0.9 MB. (wasmtime, which
# the plan names, is several MB and compiles to machine code; these modules are small.)
# portable-dispatch: a loop, not tail calls the compiler has to turn into jumps: without that
# guarantee (a debug build) the other way overflows the stack of whoever runs a module.
wasmi = { version = "2", default-features = false, features = ["std", "validate", "portable-dispatch"] }
# A body read and sent a piece at a time (blobs.rs; a test's request too); in the tree already.
futures-util = "0.3"
# A backup is a tar (in the tree through kith-runtime, which unpacks image layers with it).
tar = { version = "0.4", default-features = false }
# The blob store's names. `pure`: no C or assembly to build for musl.
blake3 = { version = "1", default-features = false, features = ["pure", "std"] }
sha2 = "0.11"
# The TPM's sessions encrypt what crosses its bus in AES-128-CFB (tpm.rs): ring has no AES
# block alone. The block cipher only; CFB is a few lines in tpm.rs, and CBC for a FIDO2
# key's hmac-secret a few in fido2.rs. `zeroize`: the round keys are wiped when a cipher
# drops (kithd's release size, measured with and without: 13424160 bytes both).
aes = { version = "0.9", default-features = false, features = ["zeroize"] }
# A PIN and the TPM's lockout authorization are zeroed once used (crypt.rs, tpm.rs); in the
# tree already, through rustls.
zeroize = "1"

# No logger is installed (kithd writes its own lines), so a release build compiles no `log`
# call of reqwest, rustls-platform-verifier or netlink away from being a no-op check.
log = { version = "0.4", features = ["release_max_level_off"] }

[dev-dependencies]
# (A process on this host in the place of a container's, to test exec's terminal with.)
kith-runtime = { path = "../kith-runtime", features = ["host"] }
# (A clock a test owns: the waiting console answers at a fixed time.)
tokio = { version = "1", features = ["test-util"] }
serde_json.workspace = true
# (The ACME tests' authority reads the CSR it is sent: rcgen's parser, already in the tree.)
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
# Test modules are written as text.
wat = "1"

[lints]
workspace = true
