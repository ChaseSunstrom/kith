# A Job runs to completion: `kith apply -f examples/backup-job.yaml`, then
# `kith get job` and `kith logs job/backup`. Its unit is an exec unit: a plain
# process of the host in its own cgroup, for host-level tools.
apiVersion: kith.dev/v1
kind: Job
metadata:
  name: backup
spec:
  # Failed runs to forgive before the Job has failed.
  retries: 2
  timeoutSeconds: 600
  template:
    exec:
      - name: archive
        command: [sh, -c, "tar -czf /tmp/etc-backup.tar.gz -C /etc os-release && echo archived"]
        resources:
          memory: 64Mi
