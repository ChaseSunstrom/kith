<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1036.9 773" width="1036.9" height="773" role="img" aria-labelledby="t d" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
<title id="t">One process on every node</title><desc id="d">kith → Resource API (apply, get, logs); Web UI → Resource API (watch); Resource API → Store (all or nothing); Store → Scheduler (placement); Store → Controller (replicas); Controller → Containers, processes, VMs (start, stop); Store → Mesh, Services, DNS (names, peers); Mesh, Services, DNS → WireGuard (peers); Store → Cluster (the log); Cluster → kithd (Raft)</desc>
