<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1042.3 978" width="1042.3" height="978" role="img" aria-labelledby="t d" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
<title id="t">kith OS: from power-on, and through an update</title><desc id="d">Firmware → systemd-boot; systemd-boot → Kernel image, slot a or b (one try fewer); Kernel image, slot a or b → Root, 6 MB (a changed block is refused); Root, 6 MB → kithd, the first process; kithd, the first process → config (reads); kithd, the first process → state (mounts); kithd, the first process → OSRelease (one node at a time); OSRelease → The other slot (written); The other slot → Marked good (restart)</desc>
<style>.f{animation:f 1.7s linear infinite}@keyframes f{to{stroke-dashoffset:-17}}@media (prefers-reduced-motion:reduce){.f{animation:none}}</style>
