[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
kith-yaml = { path = "crates/kith-yaml" }
kith-api = { path = "crates/kith-api" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = { version = "1", features = ["preserve_order"] }
saphyr-parser = "0.3"
clap = { version = "4", features = ["derive", "env"] }
similar = "2"

# PLAN.md §5: unsafe only in future `*-sys` crates, which opt out explicitly.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# PLAN.md §5: LTO, panic=abort; budgets are checked by ci/budgets.py.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
