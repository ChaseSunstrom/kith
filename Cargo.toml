[workspace]
resolver = "3"
members = ["crates/*"]
# The controller SDK is built for wasm32, apart from the rest.
exclude = ["sdk"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
kith-yaml = { path = "crates/kith-yaml" }
kith-api = { path = "crates/kith-api" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = { version = "1", features = ["preserve_order"] }
saphyr-parser = "0.3"
# (No colour: it is some 60 kB of the 3 MB kith may be.)
clap = { version = "4", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context", "suggestions"] }
similar = "2"

# PLAN.md §5: unsafe only in future `*-sys` crates, which opt out explicitly.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# PLAN.md §5: LTO, panic=abort; budgets are checked by ci/budgets.py.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
