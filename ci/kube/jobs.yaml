# What runs to its end, once and by the clock: each asks the shop and the db through their
# Services and writes what it heard.
apiVersion: batch/v1
kind: Job
metadata:
  name: ask
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: ask
          image: kith.test/pod:1
          command: ["/bin/pod", "ask", "shop", "80", "db", "80"]
---
# What a pod is told of the replicas: each replica's own name and the headless Service's
# name, as the resolver gives them (AAAA: the addresses the Workload's replicas are on).
apiVersion: batch/v1
kind: Job
metadata:
  name: replicas
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: replicas
          image: kith.test/pod:1
          command:
            - /bin/pod
            - lookup
            - db-0.db-replicas.default.svc.cluster.local
            - db-replicas.default.svc.cluster.local
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tick
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: tick
              image: kith.test/pod:1
              command: ["/bin/pod", "ask", "shop", "80", "db", "80"]
