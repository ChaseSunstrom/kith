# A Deployment whose pods are ready only when a command in them says so (T-1074): each makes
# a file five seconds after it starts, and its readinessProbe is an exec that passes once the file is
# there. A rollout must not call a new pod ready before then.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gate
  template:
    metadata:
      labels:
        app: gate
    spec:
      containers:
        - name: gate
          image: kith.test/pod:1
          command: ["/bin/sh", "-c", "sleep 5; echo up >/gate/ready; exec sleep 100000"]
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f /gate/ready"]
            periodSeconds: 1
          volumeMounts:
            - name: gate
              mountPath: /gate
      volumes:
        - name: gate
          emptyDir: {}
