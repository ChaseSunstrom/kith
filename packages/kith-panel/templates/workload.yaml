apiVersion: kith.dev/v1
kind: Workload
metadata:
  name: {{ name }}
  labels:
    app: {{ name }}
spec:
  replicas: 1
  template:
    deviceClaims: [{{ name }}]
    containers:
      - name: panel
        image: {{ values.image | tojson }}
        env:
          - { name: KITH_SEAT, value: {{ values.seat | tojson }} }
          - { name: WAYLAND_DISPLAY, value: {{ values.display | tojson }} }
          - { name: PIPEWIRE_RUNTIME_DIR, value: /run/seat }
          {%- for name, value in values.env | items %}
          - { name: {{ name | tojson }}, value: {{ value | tojson }} }
          {%- endfor %}
