# How many copies run.
replicas: 1
# kith runs a container as a non-root user on a read-only root: the unprivileged nginx build
# listens on 8080 and writes only /tmp.
image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
port: 8080
# The page it serves.
page: |
  <h1>Hello from kith</h1>
# Set a host to reach it from outside, over HTTPS, through the ingress nodes.
expose:
  host: ""
# More environment variables for the server: NAME: value.
env: {}
