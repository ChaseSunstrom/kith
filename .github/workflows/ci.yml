name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml pins the channel, components and the musl target.
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # kithd's TLS (ring) has C in it; the static build needs a musl C compiler.
      # A software TPM: kithd's test of its TPM commands is not let to check nothing here.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools swtpm
      - run: cargo fmt --all --check
      # Every link between the README and docs/guide/, and to each heading, goes somewhere.
      - run: python3 ci/doclinks.py --self-test && python3 ci/doclinks.py
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # A container of a kithd that is not root goes beside kithd's own cgroup, which has to be the
      # user's: the runner's is the system's, so the budget steps run in a scope of the user's systemd.
      # Ubuntu's AppArmor gives a user namespace made by a program it has no profile for no rights
      # (a container's mounts are then refused): this throwaway machine is told not to.
      - name: A systemd session of the runner's user, for the containers the time checks start
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo loginctl enable-linger "$(id -un)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for _ in $(seq 50); do [ -S "/run/user/$(id -u)/systemd/private" ] && break; sleep 0.2; done
      - name: Budget checks can fail
        run: systemd-run --user --scope --quiet python3 ci/budgets.py --self-test
      - name: Binary-size and RSS budgets
        run: systemd-run --user --scope --quiet python3 ci/budgets.py
      # kithd's idle memory is low because the code it runs at start is linked together, in the
      # order of a file: one that names little of today's kithd orders little (and a toolchain
      # with no lld of its own orders nothing: this fails then too, saying so).
      # (These two run when the budgets failed too: they say whether the order is why.)
      - name: kithd's order file still names its functions
        if: ${{ !cancelled() }}
        run: python3 ci/order.py --self-test && python3 ci/order.py --check
      # ... and names what kithd runs today: code written since the last trace that runs at start
      # or idle is linked wherever the compiler put it (43 such functions once cost 2 MB).
      # Printed, not enforced: a runner's kithd is not the traced one (33 functions the file
      # does not name ran here: its errors' texts, its C library's). It is held where the file
      # is traced: ci/budgets.py runs it off CI.
      - name: kithd's order file names what kithd runs (printed, not enforced)
        if: ${{ !cancelled() }}
        run: python3 ci/order.py --stale || true
      # Times are printed, not enforced: the budget is set from these medians (twice the slowest) once three runs are in.
      - name: Times on the CI runner (printed, not enforced)
        run: systemd-run --user --scope --quiet python3 ci/budgets.py --times
      # Agent mode as a service: dist/kithd.service's lines, run as a transient user unit, its
      # cgroups (Delegate), a Workload beside kithd, and its stop within TimeoutStopSec.
      # (After the budgets: run before them, kithd's idle RSS there read 9.42 MB, not 5.42.)
      - name: dist/kithd.service under the runner's systemd
        run: cargo build -p kithd -p kith-cli && sh ci/systemd.sh
      # Compares files only: the page, docs/numbers.json, ci/compare.txt and the README's drawings.
      - name: The website shows the numbers that were measured
        run: python3 ci/site_numbers.py --check

      # Compares files only: docs/guide/*.md, the ADRs and docs/*.html they make.
      - name: The guide's pages are what its markdown makes
        run: python3 ci/site_docs.py --self-test && python3 ci/site_docs.py --check
