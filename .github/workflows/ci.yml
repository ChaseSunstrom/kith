name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml pins the channel, components and the musl target.
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # kithd's TLS (ring) has C in it; the static build needs a musl C compiler.
      # A software TPM: kithd's test of its TPM commands is not let to check nothing here.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools swtpm
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Budget checks can fail
        run: python3 ci/budgets.py --self-test
      - name: Binary-size and RSS budgets
        run: python3 ci/budgets.py
      # Compares files only: the page, docs/numbers.json, ci/compare.txt and the README's drawings.
      - name: The website shows the numbers that were measured
        run: python3 ci/site_numbers.py --check
